<form [formRoot]="loginForm">
  <label for="email">Email</label>
  <input id="email" type="email" autocomplete="username" [formField]="loginForm.email" />
  <app-field-error [field]="loginForm.email" />

  <label for="password">Password</label>
  <input
    id="password"
    type="password"
    autocomplete="current-password"
    [formField]="loginForm.password"
  />
  <app-field-error [field]="loginForm.password" />

  @if (serverError()) {
    <p>{{ serverError() }}</p>
  }
  <button type="submit" [disabled]="loginForm().submitting()">
    {{ loginForm().submitting() ? 'Signing in...' : 'Log in' }}
  </button>
</form>
